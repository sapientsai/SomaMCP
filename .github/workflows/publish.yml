name: Publish to NPM

on:
  push:
    tags:
      - "v*" # Trigger on version tags (v1.0.0, v1.2.3, etc.)

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for GitHub release
      id-token: write # Required for npm provenance / OIDC trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Verify package contents
        run: |
          echo "Files to be published:"
          npm pack --dry-run

      # A prerelease (a version with a hyphen, e.g. 2.2.0-next.0) goes to the `next`
      # dist-tag, so `latest` and every caret range stay on the last stable release.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
