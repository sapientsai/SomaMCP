packages:
  - "."
  - "examples/*"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "typescript"
  - "*rimraf*"
  - "*cross-env*"

overrides:
  vite: "7.3.7"
  "fast-uri@<3.1.6": "^3.1.6"
  "postcss@<8.5.23": "^8.5.23"
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12"

minimumReleaseAgeExclude:
  - "*functype*"
  - "ts-builds"

allowBuilds:
  workerd: true
  esbuild: true
  tldjs: true
