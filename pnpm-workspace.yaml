packages:
  - "."
  - "examples/*"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "typescript"
  - "*rimraf*"
  - "*cross-env*"

overrides:
  vite: "^8.3.5"
  "fast-uri@<3.1.6": "^3.1.6"
  "postcss@<8.5.23": "^8.5.23"
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12"
  # miniflare (dev only) pins these exactly, below their advisories' fixes.
  "undici@>=7.0.0 <7.29.1": "^7.29.1"
  "sharp@<0.35.5": "^0.35.5"

minimumReleaseAgeExclude:
  - "*functype*"
  - "ts-builds"
  - tsdown@0.23.2
  - "@modelcontextprotocol/client@2.4.0"
  - "@modelcontextprotocol/core@2.4.0"
  - "@modelcontextprotocol/server@2.4.0"
  - "@modelcontextprotocol/sdk@1.32.2"

allowBuilds:
  workerd: true
  esbuild: true
  tldjs: true
