packages:
  - "."
  - "examples/*"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "typescript"
  - "*rimraf*"
  - "*cross-env*"

overrides:
  vite: "7.3.3"

minimumReleaseAgeExclude:
  - "*functype*"
  - "ts-builds"
  - fastmcp@4.17.1 || 4.20.0
  - mcp-proxy@6.7.12

allowBuilds:
  esbuild: true
  tldjs: true
